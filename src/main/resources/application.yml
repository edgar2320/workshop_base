spring:
  application:
    name: workshop
  datasource:
    url: ${BD_URL}
    username: ${BD_USER}
    password: ${BD_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
            dialect: org.hibernate.dialect.MySQL5Dialect
server:
  servlet:
    context-path:  /api/v1/workshop
  port: 9091

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Configuración JWT
